[project]
name = "wifi-portal-automation"
version = "0.1.0"
description = "Auto-connect to open WiFi networks and complete captive portals on Linux and rooted Android (Tasker+Termux)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
]

[project.scripts]
wpa-auto = "wifi_portal_automation.cli:main"
wpa-android = "wifi_portal_automation.android:main"
wpa-analyze-portal = "wifi_portal_automation.portal_analyzer:main"
wpa-costco-probe = "wifi_portal_automation.costco_probe:main"
wpa-portal-probe = "wifi_portal_automation.portal_probe:main"
wpa-costco = "wifi_portal_automation.costco_portal:main"
wpa-nudge = "wifi_portal_automation.wifi_nudge:main"
wpa-tasker-gen = "wifi_portal_automation.tasker_gen:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wifi_portal_automation"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["scripts/*.sh"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/wifi_portal_automation"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]
